set_user:
  fields:
    user_id:
      example: "a1b2c3d4e5f6"
      selector:
        text:
    username:
      example: "anna"
      selector:
        text:
    onboard:
      example: true
      selector:
        boolean:
    notify:
      example: true
      selector:
        boolean:
    role:
      example: "crew"
      selector:
        text:

set_user_notifiers:
  fields:
    user_id:
      example: "a1b2c3d4e5f6"
      selector:
        text:
    username:
      example: "anna"
      selector:
        text:
    notifiers:
      example: "notify.mobile_app_anna, notify.telegram_anna"
      required: true
      selector:
        object:
    mode:
      default: "replace"
      selector:
        select:
          options:
            - "replace"
            - "add"
            - "remove"

reload_users:

export_state:

list_notifiers:
  fields:
    domain_filter:
      example: "mobile_app"
      selector:
        text:
